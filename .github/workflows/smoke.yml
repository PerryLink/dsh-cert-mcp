name: smoke
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # ONE type ruler, measured over the published line: tsconfig.check.json
      # carries no `paths`, so `@deepseek-ai/*` resolves through this repo's own
      # node_modules (the pinned devDependencies). `typecheck:ci` is the
      # historical no-op duplicate (its only extra key is an empty `paths: {}`)
      # and is kept for compatibility with existing references, not as a second
      # type face. This package declares no DSH peer and has no checkout face to
      # point at. The independent second piece of evidence is the runtime suite
      # below, which mounts the REAL SystemPrompt/ToolRuntime: a registration
      # shape that only looks right in TypeScript still fails this job.
      - name: Gate
        run: |
          pnpm run typecheck
          pnpm run typecheck:ci
          pnpm test

      - name: README sync (five languages)
        run: pnpm run check:readmes