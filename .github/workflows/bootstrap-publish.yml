name: bootstrap publish

# One-off: publish the FIRST version of the new package name.
#
# npm's trusted publishing is configured on the package's own settings page, and a
# package that has never been published has no such page - so the very first
# publish of `dsh-cert-mcp` cannot use OIDC. This workflow publishes once with the
# repo's NPM_TOKEN secret to create the package; the trusted publisher is
# registered immediately afterwards and this file is deleted again, so the tagged
# release path stays OIDC-only (`release.yml`).

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish the first version with the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "publishing dsh-cert-mcp@${version} with the repository token (bootstrap only)"
          npm publish --access public --provenance
