name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The runtime suite mounts the real DSH runtimes, so the release gate needs
      # the devDependencies installed before it can run.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No registry-url on purpose: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
          # the secret retired that line is an empty bearer token - the registry
          # answers 404 on PUT instead of letting npm do the OIDC exchange.
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      # Trusted publishing: the OIDC token (id-token: write at the top) replaces
      # the long-lived NPM_TOKEN, so this step reads no secret. The empty-token
      # guard is gone on purpose - with the secret retired it would fail every
      # release. The npm upgrade is required (the runner ships npm 10.x).
      - name: Upgrade npm and show what the publish will authenticate with
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi
      - name: Publish to npm
        shell: bash
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-cert-mcp@${version}" version >/dev/null 2>&1; then
            echo "dsh-cert-mcp@${version} is already published; skipping npm publish"
          else
            npm publish --access public --provenance
          fi
      - name: Verify the version is live on the registry
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in 1 2 3 4 5 6; do
            if npm view "dsh-cert-mcp@${version}" version >/dev/null 2>&1; then
              echo "dsh-cert-mcp@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 5
          done
          echo "::error::dsh-cert-mcp@${version} is not on the registry after the publish step"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
