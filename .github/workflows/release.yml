name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release
  id-token: write # npm provenance

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # The runtime suite mounts the real DSH runtimes, so the release gate needs
      # the devDependencies installed before it can run.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No registry-url on purpose: it writes
          # //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} into .npmrc, and with
          # the secret retired that line is an empty bearer token - the registry
          # answers 404 on PUT instead of letting npm do the OIDC exchange.
      - name: Verify the tag matches the package version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${tag}"
            exit 1
          fi
      # Trusted publishing: the OIDC token (id-token: write at the top) replaces
      # the long-lived NPM_TOKEN, so this step reads no secret. The empty-token
      # guard is gone on purpose - with the secret retired it would fail every
      # release. The npm upgrade is required (the runner ships npm 10.x).
      - name: Upgrade npm and show what the publish will authenticate with
        shell: bash
        run: |
          npm install -g npm@^11.5.1
          echo "npm: $(npm --version)"
          echo "registry: $(npm config get registry)"
          if [ -f .npmrc ]; then echo "--- workspace .npmrc ---"; cat .npmrc; else echo "no workspace .npmrc"; fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then echo "OIDC request TOKEN: present"; else echo "OIDC request TOKEN: MISSING"; fi
      - name: Publish to npm
        shell: bash
        env:
          # npm's OIDC exchange never throws: a failure is only visible at verbose
          # level, otherwise the step just fails with ENEEDAUTH and no reason.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-cert-mcp@${version}" version >/dev/null 2>&1; then
            echo "dsh-cert-mcp@${version} is already published; skipping npm publish"
            exit 0
          fi
          # A tag push and a workflow_dispatch can race (different refs, so the
          # concurrency group does not serialize them). If the other run wins,
          # the registry answers 403 "previously published"; that is success for
          # this run, not a red release. A staged-but-unapproved version (409)
          # still fails: it is not installable until a maintainer approves it.
          set +e
          out="$(npm publish --access public --provenance 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then exit 0; fi
          if printf '%s' "$out" | grep -qE 'EPUBLISHCONFLICT|previously published'; then
            echo "dsh-cert-mcp@${version} was already published by a concurrent run; treating this as done"
            exit 0
          fi
          exit "$status"
      # Advisory only. The publish step above is the hard gate (it exits non-zero
      # when the publish itself fails); npm's READ side can lag minutes behind a
      # successful publish, and a hard failure here skipped the GitHub Release
      # step and left a published version without a Release page - observed on
      # v0.2.1.
      - name: Verify the version is live on the registry (advisory)
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 12); do
            if npm view "dsh-cert-mcp@${version}" version >/dev/null 2>&1; then
              echo "dsh-cert-mcp@${version} is live on the registry"
              exit 0
            fi
            echo "attempt ${attempt}: not visible on the registry yet; retrying"
            sleep 15
          done
          echo "::warning::dsh-cert-mcp@${version} is still not visible on the registry after ~3 minutes (the publish step reported success; npm's read side is lagging)"

      # workflow_dispatch has no tag ref, so action-gh-release cannot infer one
      # and fails with "GitHub Releases requires a tag" after npm has already
      # published. Resolve the tag from the version that was just released.
      - name: Resolve the release tag
        id: release-tag
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          generate_release_notes: true

  # Publishes server.json to the official MCP Registry. It needs `publish` (the
  # registry verifies npm ownership through package.json#mcpName on the published
  # package) and is its own job, so a registry hiccup cannot cost the GitHub
  # Release the publish job has just created. Reusable, dispatchable by hand.
  mcp-registry:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp.yml
