<text x="40" y="118" fill="#8496f5" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">1 · TWO ENTRY POINTS</text>
<text x="428" y="118" fill="#8496f5" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">2 · ONE CORE</text>
<text x="740" y="118" fill="#8496f5" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">3 · THREE REPLIES</text>
<g filter="url(#soft)"><rect x="40" y="146" width="348" height="160" rx="18" fill="#161b26" stroke="#2a3142"/></g>
<text x="60" y="174" fill="#8496f5" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">stdio process</text>
<text x="60" y="204" fill="#f0f3f9" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17.5" font-weight="700">node src/index.js</text>
<text x="60" y="236" fill="#a8b1c4" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">readline: one JSON-RPC frame per line</text>
<text x="60" y="262" fill="#a8b1c4" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">initialize · tools/list · tools/call</text>
<text x="60" y="292" fill="#737b8d" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">any MCP client can spawn it</text>
