<text x="760" y="354" fill="#f0f3f9" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">repo / grade / snapshot rows</text>
<text x="760" y="380" fill="#f0f3f9" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">coverage: opt-in subset</text>
<text x="760" y="406" fill="#737b8d" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">count ≠ ecosystem coverage</text>
