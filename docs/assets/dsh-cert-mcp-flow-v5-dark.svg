<text x="44" y="82" fill="#a8b1c4" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="15.5">two entry points, one handleRequest core, three reply shapes</text>
<text x="1056" y="50" text-anchor="end" fill="#737b8d" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">stdio · JSON-RPC 2.0 · spec v1 · read-only</text>

<rect x="28" y="132" width="372" height="360" rx="22" fill="#121824" stroke="#2a3142"/>
