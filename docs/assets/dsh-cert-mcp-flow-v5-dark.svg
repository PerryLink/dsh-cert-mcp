<text x="760" y="210" fill="#f0f3f9" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">one record: grade · snapshot</text>
<text x="760" y="236" fill="#f0f3f9" font-family="Segoe UI, Microsoft YaHei, ui-sans-serif, system-ui, sans-serif" font-size="14">five dimensions · veto</text>
<text x="760" y="262" fill="#737b8d" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">miss → a no-record sentence</text>
